name: Build Paper Scanner

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (simple mode)
        run: |
          echo "=== STARTING SIMPLE BUILD ==="
          ./gradlew tasks --all | grep -i assemble || true
          echo "--- Building APK ---"
          ./gradlew assembleDebug --no-daemon --stacktrace --info || ./gradlew build --no-daemon --stacktrace --info -x test
          echo "=== BUILD FINISHED ==="
          echo "--- Checking APK location ---"
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null
          ls -la
          ls -la app/build/ 2>/dev/null
          ls -la app/build/outputs/ 2>/dev/null
          ls -la app/build/outputs/apk/ 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>/dev/null

      - name: Find and list ALL build artifacts
        run: |
          echo "=== FULL FILE LISTING ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
          echo "--- Directory structure ---"
          tree -L 3 2>/dev/null || ls -laR app/ 2>/dev/null || ls -laR 2>/dev/null

      - name: Upload ANY APK found
        uses: actions/upload-artifact@v4
        with:
          name: paper-scanner-apk
          path: |
            app/build/outputs/apk/**/*.apk
            **/*.apk
            **/*.aab
          retention-days: 30
