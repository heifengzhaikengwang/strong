name: Build Paper Scanner APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          arguments: assembleDebug
          
      - name: Find and list APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -o -name "*.aab" -type f
          echo "=== Build directory ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || ls -la app/build/ || ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-scanner-apk
          path: |
            app/build/outputs/apk/**/*.apk
            **/*.apk
          retention-days: 30
